[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safeprocess-reconstruction"
version = "0.1.1"
description = "Context-aware supervision for selective sensor reconstruction"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Björn Ludwig"}, {name = "Oliver Niggemann"}]
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scipy>=1.10,<2",
 "scikit-learn>=1.3,<2", "torch>=2.2,<3", "pyarrow>=14,<24",
 "rdflib>=6,<8", "PyYAML>=6,<7", "openpyxl>=3,<4", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[project.scripts]
safeprocess = "safeprocess.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safeprocess = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
