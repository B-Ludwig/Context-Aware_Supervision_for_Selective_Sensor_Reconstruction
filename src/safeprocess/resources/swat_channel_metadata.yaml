version: 1
evidence_sources:
  G17-T2: Goh et al. (2017), A Dataset to Support Research in the Design of Secure
    Water Treatment Systems, Section 4.1 and Table 2.
  W18-T1: Wang et al. (2018), Verifying a Water Treatment System, Background and Table
    1.
  W18-RES: Wang et al. (2018), Verifying a Water Treatment System, case-study results.
  M16-EXP: 'Mathur and Tippenhauer (2016), SWaT: A Water Treatment Testbed for Research
    and Training on ICS Security, Section III.'
  REL: 'Authored SWaT physical-data audit: Normal_v0/Normal_v1 aliasing and published
    engineering-unit discrepancies retained as source notes.'
  TAX: Authored tag taxonomy. Sensor/state separation is implemented in datasets/swat.py
    and paper_channels.json.
